services:
  db:
    image: postgres:17.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dev
    volumes:
      - wallet_db_data:/var/lib/postgresql/data
    ports:
      - "54321:5432"
  redis:
    image: redis:8.2
    ports:
      - "6380:6379"
volumes:
  wallet_db_data: